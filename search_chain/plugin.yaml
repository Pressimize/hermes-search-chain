name: search-chain
version: 0.2.0
description: "web_search fallback chain over up to nine search services; moves on when a stage fails or its quota is used up"
author: "Pressimize and Claude (Anthropic)"
license: MIT
homepage: "https://github.com/Pressimize/hermes-search-chain"
kind: backend
requires_hermes: ">=0.21"
provides_web_providers:
  - search-chain
requires_env:
  - name: EXA_API_KEY
    description: "Exa API key (stage 1 by default, skipped if unset)"
    secret: true
  - name: PARALLEL_API_KEY
    description: "Parallel API key (stage 2 by default, skipped if unset)"
    secret: true
  - name: FIRECRAWL_API_KEY
    description: "Firecrawl API key (stage 9 by default, skipped if unset)"
    secret: true
optional_env:
  - name: BRAVE_SEARCH_API_KEY
    description: "Brave Search API key (stage 3 by default, skipped if unset)"
    secret: true
  - name: NIMBLE_API_KEY
    description: "Nimble API key (stage 4 by default, skipped if unset)"
    secret: true
  - name: TAVILY_API_KEY
    description: "Tavily API key (stage 5 by default, skipped if unset)"
    secret: true
  - name: YDC_API_KEY
    description: "You.com API key (stage 6 by default, skipped if unset)"
    secret: true
  - name: SEARXNG_URL
    description: "Address of your SearXNG instance with JSON output enabled (stage 7 by default, skipped if unset)"
    secret: true
  - name: DEGOOG_URL
    description: "Address of your Degoog instance (stage 8 by default, skipped if unset)"
    secret: true
  - name: SEARCH_CHAIN_ORDER
    description: "Stages to use, in order, comma-separated (default exa,parallel,brave,nimble,tavily,youcom,searxng,degoog,firecrawl)"
  - name: SEARCH_CHAIN_EXA_HIGHLIGHT_CHARS
    description: "Characters of Exa highlights per result (default 600; 0 uses Exa's default)"
  - name: SEARCH_CHAIN_PARALLEL_API
    description: "Set to v1 to call Parallel's GA endpoint instead of the beta endpoint"
